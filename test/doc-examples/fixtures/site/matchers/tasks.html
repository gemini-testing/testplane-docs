<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Task list</title>
    </head>
    <body>
        <h1>Task list</h1>
        <img id="logo" src="../guides/logo.svg" alt="Team logo" />
        <label>Username <input id="username" class="form-control" value="user" /></label>
        <label><input type="checkbox" id="notifications" checked /> Notify me</label>
        <ol id="stages">
            <li>Draft</li>
            <li>Review</li>
            <li>Publish</li>
        </ol>
        <ul id="tasks">
            <li>Outline</li>
            <li>Write</li>
            <li>Proofread</li>
            <li>Test</li>
            <li>Publish</li>
        </ul>
        <button id="reload">Reload</button>
        <button id="save">Save</button>
        <button id="pending" disabled>Pending</button>
        <output id="source"></output>
        <canvas id="preview" width="50" height="23"></canvas>
        <a href="https://webdriver.io">WebdriverIO</a>
        <output id="analytics">Loading analytics</output>
        <script
            src="analytics.js"
            onerror="document.querySelector('#analytics').textContent = 'Analytics unavailable'"
        ></script>
        <script>
            const source = document.querySelector("#source");

            async function load(options) {
                source.textContent = "Loading";
                try {
                    const response = await fetch("/api/items", options);
                    const data = await response.json();
                    source.textContent = data.source ?? data.title;
                    source.dataset.status = response.status;
                    source.dataset.owner = response.headers.get("X-Owner") ?? "";
                } catch {
                    source.textContent = "Unavailable";
                }
            }

            document.querySelector("#reload").onclick = () => load();
            document.querySelector("#save").onclick = () =>
                load({
                    method: "POST",
                    headers: { "Content-Type": "application/json", "X-Example": "tasks" },
                    body: JSON.stringify({
                        title: "Ship feature",
                        username: document.querySelector("#username").value,
                    }),
                });
        </script>
    </body>
</html>
