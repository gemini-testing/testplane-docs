<!doctype html>
<meta charset="utf-8" />
<title>Color switch</title>
<style>
    body {
        margin: 0;
    }
    .form,
    .button {
        width: 40px;
        height: 40px;
    }
    .button {
        display: block;
        padding: 0;
        border: 0;
        outline: none;
        background: green;
    }
    .button[aria-pressed="true"] {
        background: blue;
    }
    .fullscreen .form,
    .fullscreen .button {
        width: 100vw;
        height: 100vh;
    }
</style>
<main class="modal">
    <div class="form">
        <button
            class="button"
            aria-label="Toggle color"
            aria-pressed="false"
            onclick="this.setAttribute('aria-pressed', 'true')"
        ></button>
    </div>
</main>
