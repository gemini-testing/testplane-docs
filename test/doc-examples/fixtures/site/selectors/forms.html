<!doctype html>
<html lang="en">
    <meta charset="utf-8" />
    <title>Account and checkout</title>
    <form id="registration">
        <div id="email-field">
            <label for="email">Email</label>
            <input id="email" name="email" class="invalid" />
            <span class="error">Enter an email address</span>
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" />
        </div>
    </form>
    <form id="checkout">
        <label>City <input name="city" /></label>
        <label>Street <input name="street" /></label>
    </form>
    <ul class="menu">
        <li>Account</li>
        <li>
            Order
            <ul>
                <li>Receipt</li>
            </ul>
        </li>
    </ul>
    <section><h2>Contacts</h2></section>
    <section id="billing"><h2>Billing</h2></section>
</html>
