<!doctype html>
<html lang="en">
    <meta charset="utf-8" />
    <title>Documentation guide</title>
    <nav class="navbar" aria-label="Navigation">
        <a href="#docs">Documentation</a>
        <a href="#guides">Docs</a>
        <a href="#api">API</a>
    </nav>
    <main id="__docusaurus" data-testid="main-content">
        <h1>Documentation guide</h1>
        <div>Testplane</div>
        <button type="button" onclick="location.hash = 'docs'">Get started</button>
        <button
            type="button"
            class="DocSearch-Button"
            aria-label="Open search"
            onclick="document.querySelector('dialog').showModal()"
        >
            Search
        </button>
        <dialog aria-label="Search documentation">
            <label
                >Query <input type="search" placeholder="Search docs" data-testid="search-input"
            /></label>
            <output aria-live="polite"></output>
        </dialog>
        <section id="docs"><h2>Documentation</h2></section>
        <section id="guides"><h2>Guides</h2></section>
        <section id="api"><h2>API</h2></section>
        <section id="debugging">
            <h2>
                <a href="#debugging" title="Direct link to Rich Debugging Capabilities"
                    >Rich Debugging Capabilities</a
                >
            </h2>
        </section>
        <img alt="The Great Gatsby" src="cover.svg" />
        <my-custom-element>
            <template shadowrootmode="open">
                <button onclick="this.textContent = 'Expanded'">Expand</button>
                <span class="slot-item">One</span>
                <span class="slot-item">Two</span>
            </template>
        </my-custom-element>
    </main>
    <script>
        const search = document.querySelector('input[type="search"]');
        if (new URLSearchParams(location.search).get("lang") === "ru") {
            document.documentElement.lang = "ru";
            document.querySelector('nav a[href="#docs"]').textContent = "Документация";
            document.querySelector(".DocSearch-Button").setAttribute("aria-label", "Открыть поиск");
            search.placeholder = "Поиск";
        }
        search.oninput = () => (document.querySelector("output").value = search.value);
    </script>
</html>
